# versions.yaml
#
# Single source of truth for the current release of every container image and
# Helm chart published from this repository.
#
# Consumed by:
#   - scripts/update-versions.sh  (regenerates VERSIONS.md, refreshes digests)
#   - documentation examples, deployment manifests and, in future, CI jobs that
#     need to know "what is the current version of X".
#
# Ordering rules (do not reorder by hand):
#   - `components` are listed in deployment order: data stores first, then the
#     AxonOps services that depend on them, then the operator images, then the
#     Helm charts. Anything reading this file top-to-bottom gets a valid
#     install order.
#   - Within a component, `current` is the newest published release and
#     `previous` is newest-first. Position in `previous` is the only ordering
#     signal: do not rely on string sorting, the tag formats differ per image.
#
# Field reference:
#   name             Component identifier, matches the directory in this repo.
#   kind             `image` or `chart`.
#   git_tag          Git tag in this repository that produced `current`.
#   registry         Registry host serving the image.
#   repository       Repository path within the registry.
#   tag_pattern      How the image tag is composed for this component.
#   current.tag      Newest published tag.
#   current.digest   Manifest digest of `current.tag`, as published. This is the
#                    value to deploy with — see VERSIONS.md and the root README
#                    section "Gold Standard Security Deployment". Refresh with
#                    `scripts/update-versions.sh --refresh`.
#   previous         Previously published tags, newest-first.
#   notes            Anything a consumer needs to know before pinning.

