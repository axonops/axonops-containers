name: 'K8ssandra Test cqlai'
description: 'Tests cqlai installation and CQL operations'
inputs:
  container_name:
    description: 'Name of the running container'
    required: true
    default: 'cassandra-test'

runs:
  using: 'composite'
  steps:
    - name: Verify cqlai is installed
      shell: bash
      run: |
        echo "Checking cqlai installation..."
        docker exec ${{ inputs.container_name }} cqlai --version
        echo "cqlai is installed"

    - name: Test CQL operations with cqlai
      shell: bash
      run: |
        echo "=== Testing CQL operations with cqlai ==="

        echo "Creating keyspace..."
        docker exec ${{ inputs.container_name }} cqlai -e "CREATE KEYSPACE IF NOT EXISTS cqlai_test WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"

        echo "Creating table..."
        docker exec ${{ inputs.container_name }} cqlai -e "CREATE TABLE IF NOT EXISTS cqlai_test.users (id UUID PRIMARY KEY, name TEXT, email TEXT, created_at TIMESTAMP);"

        echo "Inserting test data..."
        docker exec ${{ inputs.container_name }} cqlai -e "INSERT INTO cqlai_test.users (id, name, email, created_at) VALUES (uuid(), 'Alice', 'alice@example.com', toTimestamp(now()));"
        docker exec ${{ inputs.container_name }} cqlai -e "INSERT INTO cqlai_test.users (id, name, email, created_at) VALUES (uuid(), 'Bob', 'bob@example.com', toTimestamp(now()));"
        docker exec ${{ inputs.container_name }} cqlai -e "INSERT INTO cqlai_test.users (id, name, email, created_at) VALUES (uuid(), 'Charlie', 'charlie@example.com', toTimestamp(now()));"

        echo "Selecting data..."
        docker exec ${{ inputs.container_name }} cqlai -e "SELECT * FROM cqlai_test.users;"

        echo "Verifying data..."
        # Capture first, then grep. Piping cqlai straight into `grep -q` makes
        # grep exit on the first match, which SIGPIPEs cqlai; under pipefail the
        # step then fails with exit 141, depending on how the write races the
        # match.
        ROWS=$(docker exec ${{ inputs.container_name }} cqlai -e "SELECT * FROM cqlai_test.users;")
        if ! echo "$ROWS" | grep -q "example.com"; then
          echo "ERROR: expected rows not found in the query output"
          echo "$ROWS"
          exit 1
        fi
        echo "Data verified"

        echo "Testing UPDATE..."
        docker exec ${{ inputs.container_name }} cqlai -e "UPDATE cqlai_test.users SET name = 'Alice Updated' WHERE id IN (SELECT id FROM cqlai_test.users WHERE name = 'Alice' ALLOW FILTERING);" || true

        echo "Testing DELETE..."
        docker exec ${{ inputs.container_name }} cqlai -e "DELETE FROM cqlai_test.users WHERE id IN (SELECT id FROM cqlai_test.users WHERE name = 'Charlie' ALLOW FILTERING);" || true

        echo "Querying system tables..."
        docker exec ${{ inputs.container_name }} cqlai -e "SELECT keyspace_name, table_name FROM system_schema.tables WHERE keyspace_name = 'cqlai_test';"

        echo "Cleanup test keyspace..."
        docker exec ${{ inputs.container_name }} cqlai -e "DROP KEYSPACE cqlai_test;"

        echo "=== All cqlai CQL tests passed ==="
