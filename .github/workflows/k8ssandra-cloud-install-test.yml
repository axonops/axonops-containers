name: Test K8ssandra Cloud Installation

on:
  push:
    branches:
      - development
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'k8ssandra/**'
      - '.github/workflows/k8ssandra-cloud-install-test.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'k8ssandra/**'
      - '.github/workflows/k8ssandra-cloud-install-test.yml'
  workflow_dispatch:

env:
  K8SSANDRA_CLUSTER_NAME: axonops-dev-cass
  K8SSANDRA_NAMESPACE: k8ssandra-operator
  CASSANDRA_DC_NAME: dc1
  CASSANDRA_DC_SIZE: 1
  STORAGE_CLASS: ""
  STORAGE_SIZE: 2Gi
  CPU_LIMIT: 1
  CPU_REQUEST: 1
  MEMORY_LIMIT: 2Gi
  MEMORY_REQUEST: 1Gi
  HEAP_SIZE: 1G
  KUBERNETES_VERSION: v1.31.0
  AXON_AGENT_ORG: ${{ secrets.AXON_AGENT_ORG }}
  AXON_AGENT_KEY: ${{ secrets.AXON_AGENT_KEY }}
  AXON_AGENT_SERVER_HOST: ${{ secrets.AXON_AGENT_SERVER_HOST }}
  AXON_AGENT_SERVER_PORT: "443"

jobs:
  test-k8ssandra-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Taken from versions.yaml rather than pinned here: this test pinned
      # 5.0.7 while the publish workflows had moved to 5.0.8, so it exercised a
      # version the release no longer treated as newest.
      - name: Resolve Cassandra version to test
        run: |
          set -euo pipefail
          echo "CASSANDRA_VERSION=$(./scripts/build-matrix.sh newest | tail -1)" >> "$GITHUB_ENV"

      # The development image for a version is published by a separate,
      # manually dispatched workflow. Without this check a missing image shows
      # up 15 minutes later as an unexplained `kubectl wait` timeout.
      - name: Check the development image exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Write the tag list to a file first. Piping straight into `grep -q`
          # kills `gh` with SIGPIPE on the first match, and pipefail then turns
          # a found tag into a failed pipeline - the check reported every image
          # as missing.
          if ! gh api --paginate \
            "/orgs/axonops/packages/container/development%2Fk8ssandra%2Fcassandra/versions" \
            --jq '.[].metadata.container.tags[]' > "${RUNNER_TEMP:-/tmp}/dev-tags.txt"; then
            # A token without package read access must not masquerade as a
            # missing image. Warn and let the install step be the judge.
            echo "::warning::could not list development image tags; skipping the pre-flight check"
            exit 0
          fi
          if grep -qx "${CASSANDRA_VERSION}" "${RUNNER_TEMP:-/tmp}/dev-tags.txt"; then
            echo "✓ ghcr.io/axonops/development/k8ssandra/cassandra:${CASSANDRA_VERSION} exists"
          else
            echo "ERROR: no development image tagged ${CASSANDRA_VERSION}"
            echo "Publish it first: gh workflow run k8ssandra-development-publish-signed.yml --ref development \\"
            echo "  -f dev_git_tag=development -f container_version=${CASSANDRA_VERSION}"
            exit 1
          fi

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind-cluster
          node_image: kindest/node:${{ env.KUBERNETES_VERSION }}

      - name: Install K8ssandra Operator
        run: |
          helm upgrade --install \
            cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version v1.19.1 \
            --namespace cert-manager \
            --create-namespace \
            --wait \
            --set crds.enabled=true

          helm repo add k8ssandra https://helm.k8ssandra.io/stable
          helm upgrade --install k8ssandra-operator k8ssandra/k8ssandra-operator -n ${K8SSANDRA_NAMESPACE} \
            --create-namespace --set image.tag=v1.29.0 \
            --wait

      - name: Create Cassandra Cluster using cloud example
        run: |
          for node in $(kubectl get node -oname); do kubectl label $node topology.kubernetes.io/zone=github; done
          cat examples/k8ssandra/cluster-axonops-ubi.yaml | envsubst | kubectl apply -f -
          echo "Waiting for Cassandra cluster to start provisioning..."
          sleep 60 # Wait a bit for the cluster to start provisioning before checking status
        env:
          IMAGE_NAME: "ghcr.io/axonops/development/k8ssandra/cassandra:${{ env.CASSANDRA_VERSION }}"

      - name: Wait for Cassandra Cluster to be Ready
        run: |
          kubectl wait pods --for=condition=Ready -n ${K8SSANDRA_NAMESPACE} --timeout=900s -l app.kubernetes.io/created-by=cass-operator

      # Without this the only evidence of a failure is "timed out waiting for
      # the condition", which says nothing about why the pod never started.
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get pods -n ${K8SSANDRA_NAMESPACE} -o wide || true
          kubectl describe pods -n ${K8SSANDRA_NAMESPACE} -l app.kubernetes.io/created-by=cass-operator || true
          kubectl get events -n ${K8SSANDRA_NAMESPACE} --sort-by=.lastTimestamp | tail -50 || true
          kubectl logs -n ${K8SSANDRA_NAMESPACE} -l app.kubernetes.io/name=cass-operator --tail=100 || true
          kubectl get k8ssandracluster -n ${K8SSANDRA_NAMESPACE} -o yaml || true

      - name: Confirm it registered against AxonOps SaaS
        run: |
          TIMEOUT=180
          INTERVAL=15
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            COUNT=$(curl -s -H "Authorization: Bearer ${AXON_API_TOKEN}" \
              https://dash.axonopsdev.com/${AXON_AGENT_ORG}/api/v1/nodes/${AXON_AGENT_ORG}/cassandra/${AXON_CLUSTER_NAME} \
              | jq '.[]' | grep host_id | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "Cassandra cluster registered with AxonOps SaaS successfully ($COUNT nodes)"
              exit 0
            fi
            echo "Not registered yet, retrying in ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "===> Failed to confirm Cassandra cluster registration with AxonOps SaaS after ${TIMEOUT}s"
          exit 0
        env:
          AXON_API_TOKEN: ${{ secrets.AXON_API_TOKEN }}
          AXON_CLUSTER_NAME: ${{ env.K8SSANDRA_CLUSTER_NAME }}

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name kind-cluster
