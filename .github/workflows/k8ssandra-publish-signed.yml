name: K8ssandra Publish Signed to GHCR

on:
  workflow_dispatch:
    inputs:
      main_git_tag:
        description: 'Git tag on main branch to checkout and build (e.g., 1.0.0)'
        required: true
        type: string
      container_version:
        description: 'Container version for GHCR (e.g., 1.0.0)'
        required: true
        type: string
      axon_agent_version:
        description: 'AxonOps Agent version to install in the image (e.g., 0.1.110 or "latest")'
        required: false
        default: 'latest'
        type: string
      axon_agent_java_version:
        description: 'AxonOps Agent Java version to install (e.g., "latest" or "17.0.11")'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: axonops/k8ssandra/cassandra

jobs:
  # Every version list in this workflow comes from versions.yaml. Nothing below
  # hardcodes a Cassandra version: a list repeated in a workflow file drifts
  # silently from the one next to it, which is how 5.0.1 and 5.0.2 came to be
  # built here but left out of ALL_VERSIONS.
  k8ssandra-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      all_versions: ${{ steps.all.outputs.result }}
      newest: ${{ steps.newest.outputs.result }}
      newest_line: ${{ steps.api.outputs.newest_line }}
      api_version: ${{ steps.api.outputs.api_version }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_git_tag }}

      - name: Validate build matrix against available k8ssandra base images
        run: ./scripts/build-matrix.sh check --k8ssandra-versions '${{ vars.K8SSANDRA_VERSIONS }}'

      - name: Build matrix
        id: matrix
        run: ./scripts/build-matrix.sh versions

      - name: All versions
        id: all
        run: ./scripts/build-matrix.sh space-separated

      - name: Newest version
        id: newest
        run: ./scripts/build-matrix.sh newest

      # The release notes quote the Cassandra line and the Management API
      # version. Both are read from the same values the build uses, so the notes
      # cannot claim a version the images were not built against.
      - name: k8ssandra Management API version and newest line
        id: api
        env:
          K8SSANDRA_VERSIONS: ${{ vars.K8SSANDRA_VERSIONS }}
          NEWEST: ${{ steps.newest.outputs.result }}
        run: |
          set -euo pipefail
          KEY=$(jq -r --arg v "$NEWEST" 'keys[] | select(startswith($v + "+"))' <<<"$K8SSANDRA_VERSIONS")
          [ -n "$KEY" ] || { echo "ERROR: no K8SSANDRA_VERSIONS key for $NEWEST"; exit 1; }
          echo "api_version=${KEY#*+}" >> "$GITHUB_OUTPUT"
          echo "newest_line=$(echo "$NEWEST" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

  k8ssandra-validate:
    needs: k8ssandra-versions
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_git_tag }}

      - name: Verify tag is on main branch
        run: |
          echo "Checking if tag ${{ inputs.main_git_tag }} is on main branch..."
          TAG_COMMIT=$(git rev-parse ${{ inputs.main_git_tag }})
          echo "Tag commit: $TAG_COMMIT"
          git fetch origin main
          if git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "✓ Tag ${{ inputs.main_git_tag }} is on main branch"
          else
            echo "ERROR: Tag ${{ inputs.main_git_tag }} is not on main branch"
            exit 1
          fi

      - name: Check if container version already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking if version ${{ inputs.container_version }} exists at new path..."
          VERSIONS="${{ needs.k8ssandra-versions.outputs.all_versions }}"
          for VERSION in $VERSIONS; do
            TAG="${VERSION}-${{ inputs.container_version }}"
            echo "Checking for tag: $TAG in k8ssandra/cassandra"
            if gh api --paginate "/orgs/axonops/packages/container/k8ssandra%2Fcassandra/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"$TAG\") | .metadata.container.tags[]" 2>/dev/null | grep -q "$TAG"; then
              echo "ERROR: Container version $TAG already exists"
              exit 1
            fi
          done
          echo "✓ Container version ${{ inputs.container_version }} is available"

  k8ssandra-test:
    needs: [k8ssandra-versions, k8ssandra-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        cassandra_version: ["${{ needs.k8ssandra-versions.outputs.newest }}"]
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_git_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract base version
        id: version
        run: |
          BASE_VERSION=$(echo "${{ matrix.cassandra_version }}" | cut -d. -f1,2)
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT

      - name: Parse k8ssandra version and digest
        id: k8ssandra
        run: |
          # Find the composite key for this Cassandra version in K8SSANDRA_VERSIONS
          COMPOSITE_KEY=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r 'keys[] | select(startswith("${{ matrix.cassandra_version }}+"))')

          if [ -z "$COMPOSITE_KEY" ]; then
            echo "ERROR: No k8ssandra version found for Cassandra ${{ matrix.cassandra_version }}"
            echo "Available versions:"
            echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r 'keys[]'
            exit 1
          fi

          # Extract k8ssandra API version from composite key (e.g., "5.0.6+0.1.120" -> "0.1.120")
          K8S_API_VERSION=$(echo "$COMPOSITE_KEY" | cut -d+ -f2)

          # Get digest for this composite key
          DIGEST=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r '.["'"$COMPOSITE_KEY"'"]')

          echo "k8ssandra_api_version=$K8S_API_VERSION" >> $GITHUB_OUTPUT
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "✓ Cassandra: ${{ matrix.cassandra_version }}"
          echo "✓ k8ssandra API: v$K8S_API_VERSION"
          echo "✓ Base digest: $DIGEST"

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: ./k8ssandra/${{ steps.version.outputs.base_version }}
          file: ./k8ssandra/${{ steps.version.outputs.base_version }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: axonops-cassandra:test
          build-args: |
            CASSANDRA_VERSION=${{ matrix.cassandra_version }}
            MAJOR_VERSION=${{ steps.version.outputs.base_version }}
            K8SSANDRA_BASE_DIGEST=${{ steps.k8ssandra.outputs.digest }}
            K8SSANDRA_API_VERSION=${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ inputs.container_version }}
            GIT_TAG=${{ inputs.main_git_tag }}
            GITHUB_ACTOR=${{ github.actor }}
            CQLAI_VERSION=${{ vars.K8SSANDRA_CQLAI_VERSION }}
            IS_PRODUCTION_RELEASE=true
            IMAGE_FULL_NAME=ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.cassandra_version }}-test
            AXON_AGENT_VERSION=${{ inputs.axon_agent_version }}
            AXON_AGENT_JAVA_VERSION=${{ inputs.axon_agent_java_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify correct base image
        uses: ./.github/actions/k8ssandra-verify-base-image
        with:
          cassandra_version: ${{ matrix.cassandra_version }}
          base_version: ${{ steps.version.outputs.base_version }}
          cqlai_version: ${{ vars.K8SSANDRA_CQLAI_VERSION }}
          k8ssandra_digests_json: ${{ vars.K8SSANDRA_VERSIONS }}

      - name: Start container and wait for services
        uses: ./.github/actions/k8ssandra-start-and-wait
        with:
          container_name: cassandra-test

      - name: Verify versions (jemalloc, Cassandra, Java)
        uses: ./.github/actions/k8ssandra-verify-versions
        with:
          cassandra_version: ${{ matrix.cassandra_version }}
          container_name: cassandra-test

      - name: Test Management API
        uses: ./.github/actions/k8ssandra-test-management-api
        with:
          container_name: cassandra-test

      - name: Verify Management API version
        uses: ./.github/actions/k8ssandra-verify-mgmt-api-version
        with:
          container_name: cassandra-test
          expected_api_version: ${{ steps.k8ssandra.outputs.k8ssandra_api_version }}

      - name: Verify AxonOps
        uses: ./.github/actions/k8ssandra-verify-axonops
        with:
          container_name: cassandra-test

      - name: Test cqlai
        uses: ./.github/actions/k8ssandra-test-cqlai
        with:
          container_name: cassandra-test

      - name: Run Trivy container security scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'axonops-cassandra:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: 'k8ssandra/.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Cleanup
        if: always()
        run: |
          docker logs cassandra-test || true
          docker stop cassandra-test || true
          docker rm cassandra-test || true

  k8ssandra-create-release:
    needs: [k8ssandra-versions, k8ssandra-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_git_tag }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        env:
          CONTAINER_VERSION: ${{ inputs.container_version }}
          GIT_TAG: ${{ inputs.main_git_tag }}
          CASSANDRA_VERSIONS: ${{ needs.k8ssandra-versions.outputs.matrix }}
          NEWEST: ${{ needs.k8ssandra-versions.outputs.newest }}
          NEWEST_LINE: ${{ needs.k8ssandra-versions.outputs.newest_line }}
          API_VERSION: ${{ needs.k8ssandra-versions.outputs.api_version }}
        with:
          script: |
            // Everything version-shaped in these notes is derived from
            // versions.yaml and K8SSANDRA_VERSIONS. Writing the list out by
            // hand here is how the notes came to advertise a version set that
            // no longer matched what the matrix built.
            const image = 'ghcr.io/axonops/k8ssandra/cassandra';
            const containerVersion = process.env.CONTAINER_VERSION;
            const versions = JSON.parse(process.env.CASSANDRA_VERSIONS);
            const newest = process.env.NEWEST;
            const line = process.env.NEWEST_LINE;
            const api = process.env.API_VERSION;
            // Three tags per version, plus `{line}-latest` and `latest`.
            const tagCount = versions.length * 3 + 2;
            const immutable = `${newest}-v${api}-${containerVersion}`;

            const flags = [
              '  --certificate-identity-regexp="https://github.com/axonops/axonops-containers" \\',
              '  --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\',
              `  ${image}:${immutable}`,
            ].join('\n');
            const verify = [
              ['# Using cosign binary', 'cosign verify \\'],
              ['# Using cosign container (no installation required)', 'docker run --rm gcr.io/projectsigstore/cosign:latest verify \\'],
              ['# Or with podman', 'podman run --rm gcr.io/projectsigstore/cosign:latest verify \\'],
            ].map(([comment, cmd]) => `${comment}\n${cmd}\n${flags}`).join('\n\n');

            const body = [
              `K8ssandra signed container images release ${containerVersion}`,
              '',
              `Built from git tag: ${process.env.GIT_TAG}`,
              '',
              `**Image path:** ${image}`,
              '**Signing:** Keyless signing with Sigstore Cosign',
              `**k8ssandra API:** v${api} (all versions)`,
              '',
              `**Published:** ${tagCount} total tags across ${versions.length} Cassandra ${line} versions`,
              `**Cassandra versions:** ${versions.join(', ')}`,
              '',
              '**Tagging strategy (3D versioning):**',
              `- Fully immutable: \`{CASS}-v{K8S_API}-{AXON}\` (e.g., \`${immutable}\`)`,
              `- k8ssandra-floating: \`{CASS}-v{K8S_API}\` (e.g., \`${newest}-v${api}\`)`,
              `- Cassandra-floating: \`{CASS}\` (e.g., \`${newest}\`)`,
              `- Minor-latest: \`${line}-latest\` (points to ${newest})`,
              `- Global-latest: \`latest\` (points to ${newest})`,
              '',
              `**Example tags for ${newest}:**`,
              `- \`${immutable}\` (immutable)`,
              `- \`${newest}-v${api}\` (latest AxonOps for this Cassandra + k8ssandra combo)`,
              `- \`${newest}\` (latest k8ssandra API + AxonOps for Cassandra ${newest})`,
              `- \`${line}-latest\` (latest ${line}.x minor)`,
              '- `latest` (global latest)',
              '',
              '**Verify signatures:**',
              '',
              '```bash',
              verify,
              '```',
            ].join('\n');

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GIT_TAG,
              name: `k8ssandra-${containerVersion}`,
              body,
              draft: false,
              prerelease: false
            });
            console.log(`Release created: ${release.data.html_url}`);
            return release.data.id;

  k8ssandra-build-push-sign:
    needs: [k8ssandra-versions, k8ssandra-test, k8ssandra-create-release]
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: a cancelled publish job
      # leaves the release half-pushed and the floating tags inconsistent.
      fail-fast: false
      max-parallel: 3
      matrix:
        cassandra_version: ${{ fromJSON(needs.k8ssandra-versions.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_git_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse k8ssandra version and digest
        id: k8ssandra
        run: |
          # Find the composite key for this Cassandra version in K8SSANDRA_VERSIONS
          COMPOSITE_KEY=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r 'keys[] | select(startswith("${{ matrix.cassandra_version }}+"))')

          if [ -z "$COMPOSITE_KEY" ]; then
            echo "ERROR: No k8ssandra version found for Cassandra ${{ matrix.cassandra_version }}"
            echo "Available versions:"
            echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r 'keys[]'
            exit 1
          fi

          # Extract k8ssandra API version from composite key (e.g., "5.0.6+0.1.110" -> "0.1.110")
          K8S_API_VERSION=$(echo "$COMPOSITE_KEY" | cut -d+ -f2)

          # Get digest for this composite key
          DIGEST=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r '.["'"$COMPOSITE_KEY"'"]')

          echo "k8ssandra_api_version=$K8S_API_VERSION" >> $GITHUB_OUTPUT
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "✓ Cassandra: ${{ matrix.cassandra_version }}"
          echo "✓ k8ssandra API: v$K8S_API_VERSION"
          echo "✓ Base digest: $DIGEST"

      - name: Determine latest version
        id: version
        uses: ./.github/actions/k8ssandra-determine-latest
        with:
          current_version: ${{ matrix.cassandra_version }}
          all_versions: ${{ needs.k8ssandra-versions.outputs.all_versions }}

      # Pushed by digest only: no tag exists until the image has passed its
      # tests and been signed, so a failure here leaves nothing pullable.
      - name: Build and push by digest (untagged)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./k8ssandra/${{ steps.version.outputs.base_version }}
          file: ./k8ssandra/${{ steps.version.outputs.base_version }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          annotations: |
            index:org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            index:org.opencontainers.image.authors=AxonOps
            index:org.opencontainers.image.url=https://axonops.com
            index:org.opencontainers.image.documentation=https://github.com/axonops/axonops-containers/blob/main/k8ssandra/README.md
            index:org.opencontainers.image.source=https://github.com/axonops/axonops-containers
            index:org.opencontainers.image.version=${{ inputs.container_version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.vendor=AxonOps
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.title=AxonOps K8ssandra Apache Cassandra ${{ matrix.cassandra_version }}
            index:org.opencontainers.image.description=Apache Cassandra ${{ matrix.cassandra_version }} + k8ssandra API v${{ steps.k8ssandra.outputs.k8ssandra_api_version }} + AxonOps monitoring + cqlai v${{ vars.K8SSANDRA_CQLAI_VERSION }}. Multi-arch (amd64/arm64), signed with cosign, optimized for Kubernetes.
            index:org.opencontainers.image.ref.name=ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.cassandra_version }}-v${{ steps.k8ssandra.outputs.k8ssandra_api_version }}-${{ inputs.container_version }}
            index:org.opencontainers.image.base.name=docker.io/k8ssandra/cass-management-api:${{ matrix.cassandra_version }}-ubi-v${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
            index:org.opencontainers.image.base.digest=${{ steps.k8ssandra.outputs.digest }}
            index:com.axonops.cassandra.version=${{ matrix.cassandra_version }}
            index:com.axonops.k8ssandra-api.version=${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
            index:com.axonops.cqlai.version=${{ vars.K8SSANDRA_CQLAI_VERSION }}
            index:com.axonops.build.actor=${{ github.actor }}
          build-args: |
            CASSANDRA_VERSION=${{ matrix.cassandra_version }}
            MAJOR_VERSION=${{ steps.version.outputs.base_version }}
            K8SSANDRA_BASE_DIGEST=${{ steps.k8ssandra.outputs.digest }}
            K8SSANDRA_API_VERSION=${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ inputs.container_version }}
            GIT_TAG=${{ inputs.main_git_tag }}
            GITHUB_ACTOR=${{ github.actor }}
            CQLAI_VERSION=${{ vars.K8SSANDRA_CQLAI_VERSION }}
            IS_PRODUCTION_RELEASE=true
            IMAGE_FULL_NAME=ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.cassandra_version }}-v${{ steps.k8ssandra.outputs.k8ssandra_api_version }}-${{ inputs.container_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull built image for testing
        run: |
          docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} axonops-cassandra:test

      - name: Start container and wait for services
        uses: ./.github/actions/k8ssandra-start-and-wait
        with:
          container_name: cassandra-test-${{ matrix.cassandra_version }}

      - name: Verify versions (jemalloc, Cassandra, Java)
        uses: ./.github/actions/k8ssandra-verify-versions
        with:
          cassandra_version: ${{ matrix.cassandra_version }}
          container_name: cassandra-test-${{ matrix.cassandra_version }}

      - name: Test Management API
        uses: ./.github/actions/k8ssandra-test-management-api
        with:
          container_name: cassandra-test-${{ matrix.cassandra_version }}

      - name: Verify AxonOps
        uses: ./.github/actions/k8ssandra-verify-axonops
        with:
          container_name: cassandra-test-${{ matrix.cassandra_version }}

      - name: Test cqlai
        uses: ./.github/actions/k8ssandra-test-cqlai
        with:
          container_name: cassandra-test-${{ matrix.cassandra_version }}

      - name: Collect logs
        if: always()
        uses: ./.github/actions/k8ssandra-collect-logs
        with:
          container_name: cassandra-test-${{ matrix.cassandra_version }}
          cassandra_version: ${{ matrix.cassandra_version }}

      - name: Cleanup test container
        if: always()
        run: |
          docker stop cassandra-test-${{ matrix.cassandra_version }} || true
          docker rm cassandra-test-${{ matrix.cassandra_version }} || true

      - name: Sign container image
        uses: ./.github/actions/k8ssandra-sign-container
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Tags are applied last, to an image that is already tested and signed.
      # imagetools create copies the index without rebuilding - the previous
      # implementation re-ran the whole multi-arch build here - so every tag
      # resolves to exactly the digest that was signed, asserted below.
      - name: Apply tags to the verified image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG_IMMUTABLE: ${{ matrix.cassandra_version }}-v${{ steps.k8ssandra.outputs.k8ssandra_api_version }}-${{ inputs.container_version }}
          TAG_API: ${{ matrix.cassandra_version }}-v${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
          TAG_CASSANDRA: ${{ matrix.cassandra_version }}
          TAG_MINOR_LATEST: ${{ steps.version.outputs.is_minor_latest == 'true' && format('{0}-latest', steps.version.outputs.base_version) || '' }}
          TAG_GLOBAL_LATEST: ${{ steps.version.outputs.is_global_latest == 'true' && 'latest' || '' }}
        run: |
          TAGS=()
          for TAG in "$TAG_IMMUTABLE" "$TAG_API" "$TAG_CASSANDRA" "$TAG_MINOR_LATEST" "$TAG_GLOBAL_LATEST"; do
            if [ -n "$TAG" ]; then TAGS+=("$TAG"); fi
          done

          ARGS=()
          for TAG in "${TAGS[@]}"; do ARGS+=(-t "${IMAGE}:${TAG}"); done
          docker buildx imagetools create "${ARGS[@]}" "${IMAGE}@${DIGEST}"

          for TAG in "${TAGS[@]}"; do
            RESOLVED=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{ .Manifest.Digest }}')
            if [ "$RESOLVED" != "$DIGEST" ]; then
              echo "ERROR: ${IMAGE}:${TAG} resolves to ${RESOLVED}, expected the signed digest ${DIGEST}"
              exit 1
            fi
            echo "${IMAGE}:${TAG} -> ${DIGEST}"
          done

      - name: Image published and signed
        run: |
          echo "✓ Image pushed and signed"
          echo "   ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.cassandra_version }}-${{ inputs.container_version }}"
