name: Cassandra Build and Test

# Builds the standalone Cassandra image - the k8ssandra Dockerfile with
# INCLUDE_MGMT_API=false - and tests it. Publishes nothing.

on:
  pull_request:
    paths:
      - 'k8ssandra/5.0/**'
      - 'cassandra/**'
      - '.github/workflows/cassandra-build-and-test.yml'
      - '.github/actions/cassandra-*/**'
  workflow_dispatch:
    inputs:
      cassandra_version:
        description: 'Cassandra version to build'
        required: false
        type: string

env:
  IMAGE_NAME: axonops/cassandra/cassandra

jobs:
  cassandra-build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cassandra_version: [5.0.8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Parse k8ssandra base digest
        id: k8ssandra
        env:
          CASSANDRA_VERSION: ${{ inputs.cassandra_version || matrix.cassandra_version }}
        run: |
          COMPOSITE_KEY=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r --arg v "$CASSANDRA_VERSION" 'keys[] | select(startswith($v + "+"))')
          if [ -z "$COMPOSITE_KEY" ]; then
            echo "ERROR: No k8ssandra base image found for Cassandra $CASSANDRA_VERSION"
            echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r 'keys[]'
            exit 1
          fi
          K8S_API_VERSION=$(echo "$COMPOSITE_KEY" | cut -d+ -f2)
          DIGEST=$(echo '${{ vars.K8SSANDRA_VERSIONS }}' | jq -r '.["'"$COMPOSITE_KEY"'"]')
          {
            echo "cassandra_version=${CASSANDRA_VERSION}"
            echo "base_version=$(echo "$CASSANDRA_VERSION" | cut -d. -f1,2)"
            echo "k8ssandra_api_version=${K8S_API_VERSION}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: ./k8ssandra/${{ steps.k8ssandra.outputs.base_version }}
          file: ./k8ssandra/${{ steps.k8ssandra.outputs.base_version }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: axonops-cassandra:test
          build-args: |
            CASSANDRA_VERSION=${{ steps.k8ssandra.outputs.cassandra_version }}
            MAJOR_VERSION=${{ steps.k8ssandra.outputs.base_version }}
            K8SSANDRA_BASE_DIGEST=${{ steps.k8ssandra.outputs.digest }}
            K8SSANDRA_API_VERSION=${{ steps.k8ssandra.outputs.k8ssandra_api_version }}
            INCLUDE_MGMT_API=false
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=pr-${{ github.event.number || github.run_number }}
            GIT_TAG=${{ github.ref_name }}
            GITHUB_ACTOR=${{ github.actor }}
            CQLAI_VERSION=${{ vars.K8SSANDRA_CQLAI_VERSION }}
            IS_PRODUCTION_RELEASE=false
            IMAGE_FULL_NAME=ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.k8ssandra.outputs.cassandra_version }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for services
        uses: ./.github/actions/cassandra-start-and-wait
        with:
          container_name: cassandra-test

      - name: Verify versions
        uses: ./.github/actions/cassandra-verify-versions
        with:
          cassandra_version: ${{ steps.k8ssandra.outputs.cassandra_version }}
          container_name: cassandra-test

      - name: Verify AxonOps
        uses: ./.github/actions/k8ssandra-verify-axonops
        with:
          container_name: cassandra-test

      - name: Test healthcheck
        uses: ./.github/actions/k8ssandra-test-healthcheck
        with:
          container_name: cassandra-test

      - name: Test cqlai
        uses: ./.github/actions/k8ssandra-test-cqlai
        with:
          container_name: cassandra-test

      - name: Run Trivy container security scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'axonops-cassandra:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: 'k8ssandra/.trivyignore'

      - name: Collect logs
        if: always()
        uses: ./.github/actions/k8ssandra-collect-logs
        with:
          container_name: cassandra-test
          cassandra_version: ${{ steps.k8ssandra.outputs.cassandra_version }}

      - name: Cleanup
        if: always()
        run: |
          docker stop cassandra-test || true
          docker rm cassandra-test || true
