repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: trailing-whitespace
        exclude: .*.md
      - id: end-of-file-fixer
        exclude: .*.md
      - id: check-yaml
        exclude: ^(axonops/charts/.*|strimzi/examples/.*)
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.30.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint]
        exclude: ^(axonops/charts/.*|\.github/workflows/.*)
  - repo: local
    hooks:
      - id: llms-full
        name: regenerate llms-full.txt
        entry: scripts/generate-llms-full.sh
        language: script
        pass_filenames: false
        files: '\.md$|^llms\.txt$|^scripts/llms-manifest\.txt$'
      - id: llms-check
        name: check llms.txt manifest coverage and links
        entry: scripts/generate-llms-full.sh --check
        language: script
        pass_filenames: false
        files: '\.md$|^llms\.txt$|^scripts/llms-manifest\.txt$'
