---
# Optional. Kafka Connect workers report to AxonOps with KAFKA_NODE_TYPE=connect.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: ${STRIMZI_CLUSTER_NAME}-connect
  namespace: ${KAFKA_NAMESPACE}
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: ${KAFKA_VERSION}
  image: ${KAFKA_CONTAINER_IMAGE}
  replicas: ${KAFKA_CONNECT_REPLICAS}
  bootstrapServers: ${STRIMZI_CLUSTER_NAME}-kafka-bootstrap:9092
  groupId: ${STRIMZI_CLUSTER_NAME}-connect
  configStorageTopic: ${STRIMZI_CLUSTER_NAME}-connect-configs
  offsetStorageTopic: ${STRIMZI_CLUSTER_NAME}-connect-offsets
  statusStorageTopic: ${STRIMZI_CLUSTER_NAME}-connect-status
  config:
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
  template:
    connectContainer:
      env:
        - name: KAFKA_NODE_TYPE
          value: connect
        - name: AXON_AGENT_CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_CLUSTER_NAME
        - name: AXON_AGENT_ORG
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_ORG
        - name: AXON_AGENT_KEY
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_KEY
        - name: AXON_AGENT_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_HOST
        - name: AXON_AGENT_SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_PORT
        - name: AXON_AGENT_TLS_MODE
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_TLS_MODE
