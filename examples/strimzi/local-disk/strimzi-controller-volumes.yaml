---
# One hostPath PersistentVolume, pinned to one node. strimzi-setup.sh applies
# it once per controller with STRIMZI_VOLUME_INDEX and STRIMZI_VOLUME_NODE set.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ${STRIMZI_CLUSTER_NAME}-controller-${STRIMZI_VOLUME_INDEX}
  labels:
    strimzi.io/cluster: ${STRIMZI_CLUSTER_NAME}
    strimzi.io/pool-name: controller
spec:
  capacity:
    storage: ${STRIMZI_CONTROLLER_STORAGE_SIZE}
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ${STRIMZI_LOCAL_STORAGE_CLASS}
  hostPath:
    path: ${STRIMZI_HOST_BASE_DIR}/${STRIMZI_CLUSTER_NAME}/controller-${STRIMZI_VOLUME_INDEX}
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ${STRIMZI_VOLUME_NODE}
