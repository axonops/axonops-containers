---
# AxonOps agent settings, read by every Kafka and Kafka Connect container
# through valueFrom.secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
  namespace: ${KAFKA_NAMESPACE}
type: Opaque
stringData:
  AXON_AGENT_CLUSTER_NAME: "${AXON_AGENT_CLUSTER_NAME}"
  AXON_AGENT_ORG: "${AXON_AGENT_ORG}"
  AXON_AGENT_KEY: "${AXON_AGENT_KEY}"
  AXON_AGENT_SERVER_HOST: "${AXON_AGENT_SERVER_HOST}"
  AXON_AGENT_SERVER_PORT: "${AXON_AGENT_SERVER_PORT}"
  AXON_AGENT_TLS_MODE: "${AXON_AGENT_TLS_MODE}"
