---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: ${KAFKA_NAMESPACE}
  labels:
    strimzi.io/cluster: ${STRIMZI_CLUSTER_NAME}
spec:
  replicas: ${STRIMZI_CONTROLLER_REPLICAS}
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      # AxonOps keeps its agent state on the volume with id 0.
      - id: 0
        type: persistent-claim
        size: ${STRIMZI_CONTROLLER_STORAGE_SIZE}
        class: ${STRIMZI_LOCAL_STORAGE_CLASS}
        # Bind only to the PersistentVolumes created for this pool.
        selector:
          strimzi.io/cluster: ${STRIMZI_CLUSTER_NAME}
          strimzi.io/pool-name: controller
        deleteClaim: false
        kraftMetadata: shared
  template:
    kafkaContainer:
      env:
        - name: KAFKA_NODE_TYPE
          value: kraft-controller
        - name: AXON_AGENT_CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_CLUSTER_NAME
        - name: AXON_AGENT_ORG
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_ORG
        - name: AXON_AGENT_KEY
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_KEY
        - name: AXON_AGENT_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_HOST
        - name: AXON_AGENT_SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_PORT
        - name: AXON_AGENT_TLS_MODE
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_TLS_MODE
