---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: ${KAFKA_NAMESPACE}
  labels:
    strimzi.io/cluster: ${STRIMZI_CLUSTER_NAME}
spec:
  replicas: ${STRIMZI_BROKER_REPLICAS}
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      # AxonOps keeps its agent state on the volume with id 0.
      - id: 0
        type: persistent-claim
        size: ${STRIMZI_BROKER_STORAGE_SIZE}
        class: ${STRIMZI_BROKER_STORAGE_CLASS}
        deleteClaim: false
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: ${KAFKA_RACK_TOPOLOGY_KEY}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              strimzi.io/cluster: ${STRIMZI_CLUSTER_NAME}
              strimzi.io/pool-name: broker
    kafkaContainer:
      env:
        - name: KAFKA_NODE_TYPE
          value: kraft-broker
        - name: AXON_AGENT_CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_CLUSTER_NAME
        - name: AXON_AGENT_ORG
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_ORG
        - name: AXON_AGENT_KEY
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_KEY
        - name: AXON_AGENT_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_HOST
        - name: AXON_AGENT_SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_SERVER_PORT
        - name: AXON_AGENT_TLS_MODE
          valueFrom:
            secretKeyRef:
              name: ${STRIMZI_CLUSTER_NAME}-axonops-agent
              key: AXON_AGENT_TLS_MODE
