# Example 02 — AxonOps SaaS monitoring a 3-node Apache Cassandra cluster
#
# No AxonOps platform runs here. The agents in each Cassandra container connect
# outbound to AxonOps SaaS over TLS, so this project is just the cluster:
#
#   cassandra-0..2     Apache Cassandra + the AxonOps agent, one rack each
#
# Quick start:
#   cp env.example .env      # set AXONOPS_ORG_NAME and AXONOPS_AGENT_KEY
#   docker compose up -d
#   open https://dash.axonops.cloud
#
# Image pinning: the image is pinned to an immutable version tag with the
# equivalent SHA256 digest commented above it. Deploy the digest form in
# production — see ../../docker/README.md "Image Pinning: Tags vs Checksums"
# and ../../VERSIONS.md for the current digest of every image.

services:
  cassandra-0:
    # Preferred (immutable): ghcr.io/axonops/cassandra/cassandra@sha256:f96804cc2fe74694988d6c28f9ae7b5b674e8959bd6f2d6b65eff3b4fa4340b5
    image: ${CASSANDRA_IMAGE:-ghcr.io/axonops/cassandra/cassandra:5.0.8}
    container_name: cassandra-0
    hostname: cassandra-0
    networks: [cassandra]
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-saas-demo-cluster}
      - CASSANDRA_SEEDS=cassandra-0
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=${CASSANDRA_DC:-dc1}
      - CASSANDRA_RACK=rack0
      - CASSANDRA_NUM_TOKENS=16
      - MAX_HEAP_SIZE=${CASSANDRA_HEAP_SIZE:-1G}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-256M}
      # AxonOps SaaS: outbound TLS to the endpoint below. Unlike example 01,
      # AXON_AGENT_TLS_MODE is left at its default so the connection is
      # encrypted, and AXON_AGENT_KEY is required.
      - AXON_AGENT_ORG=${AXONOPS_ORG_NAME:?set AXONOPS_ORG_NAME in .env}
      - AXON_AGENT_KEY=${AXONOPS_AGENT_KEY:?set AXONOPS_AGENT_KEY in .env}
      - AXON_AGENT_SERVER_HOST=${AXONOPS_SERVER_HOST:-agents.axonops.cloud}
      - AXON_AGENT_SERVER_PORT=${AXONOPS_SERVER_PORT:-443}
      - AXON_AGENT_NTP_HOST=${AXONOPS_NTP_HOST:-time.google.com}
    volumes:
      - cassandra-0-data:/var/lib/cassandra
    ports:
      - "${CQL_PORT:-9042}:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q '^running$$'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  cassandra-1:
    image: ${CASSANDRA_IMAGE:-ghcr.io/axonops/cassandra/cassandra:5.0.8}
    container_name: cassandra-1
    hostname: cassandra-1
    networks: [cassandra]
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-saas-demo-cluster}
      - CASSANDRA_SEEDS=cassandra-0
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=${CASSANDRA_DC:-dc1}
      - CASSANDRA_RACK=rack1
      - CASSANDRA_NUM_TOKENS=16
      - MAX_HEAP_SIZE=${CASSANDRA_HEAP_SIZE:-1G}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-256M}
      - AXON_AGENT_ORG=${AXONOPS_ORG_NAME:?set AXONOPS_ORG_NAME in .env}
      - AXON_AGENT_KEY=${AXONOPS_AGENT_KEY:?set AXONOPS_AGENT_KEY in .env}
      - AXON_AGENT_SERVER_HOST=${AXONOPS_SERVER_HOST:-agents.axonops.cloud}
      - AXON_AGENT_SERVER_PORT=${AXONOPS_SERVER_PORT:-443}
      - AXON_AGENT_NTP_HOST=${AXONOPS_NTP_HOST:-time.google.com}
    volumes:
      - cassandra-1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q '^running$$'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      cassandra-0:
        condition: service_healthy
    restart: unless-stopped

  cassandra-2:
    image: ${CASSANDRA_IMAGE:-ghcr.io/axonops/cassandra/cassandra:5.0.8}
    container_name: cassandra-2
    hostname: cassandra-2
    networks: [cassandra]
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-saas-demo-cluster}
      - CASSANDRA_SEEDS=cassandra-0
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=${CASSANDRA_DC:-dc1}
      - CASSANDRA_RACK=rack2
      - CASSANDRA_NUM_TOKENS=16
      - MAX_HEAP_SIZE=${CASSANDRA_HEAP_SIZE:-1G}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-256M}
      - AXON_AGENT_ORG=${AXONOPS_ORG_NAME:?set AXONOPS_ORG_NAME in .env}
      - AXON_AGENT_KEY=${AXONOPS_AGENT_KEY:?set AXONOPS_AGENT_KEY in .env}
      - AXON_AGENT_SERVER_HOST=${AXONOPS_SERVER_HOST:-agents.axonops.cloud}
      - AXON_AGENT_SERVER_PORT=${AXONOPS_SERVER_PORT:-443}
      - AXON_AGENT_NTP_HOST=${AXONOPS_NTP_HOST:-time.google.com}
    volumes:
      - cassandra-2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q '^running$$'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      cassandra-1:
        condition: service_healthy
    restart: unless-stopped

networks:
  cassandra:
    driver: bridge

volumes:
  cassandra-0-data:
  cassandra-1-data:
  cassandra-2-data:
