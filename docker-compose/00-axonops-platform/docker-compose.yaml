# AxonOps Docker Compose Stack
# This compose file deploys the complete AxonOps observability platform
#
# Quick Start:
#   1. Copy .env.example to .env and configure your settings
#   2. Run: docker compose up -d
#   3. Access dashboard at http://localhost:3000
#
# For more information, see README.md
#
# Image pinning: every service below is pinned to an immutable version tag, with
# the equivalent SHA256 digest commented out above it. For production, swap to
# the digest form - it is a cryptographic checksum of the exact image and cannot
# be moved, whereas a tag can. See "Image Pinning: Tags vs Checksums" in
# README.md, and ../VERSIONS.md for the current digest of every image.

services:
  # =============================================================================
  # axondb-timeseries: Apache Cassandra 5.0.8 for metrics storage
  # =============================================================================
  axondb-timeseries:
    # Preferred (immutable): ghcr.io/axonops/axondb-timeseries@sha256:1ae990a737d36b7c6f8eb92d6d3baf5234e5eae2a4e37fa208acd1108cad934c
    image: ghcr.io/axonops/axondb-timeseries:5.0.8-1.4.0
    container_name: axondb-timeseries
    hostname: axondb-timeseries
    networks:
      - axonops-network
    environment:
      # Cluster configuration
      - CASSANDRA_CLUSTER_NAME=axonopsdb-timeseries
      - CASSANDRA_DC=axonopsdb_dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_NUM_TOKENS=16
      - CASSANDRA_HEAP_SIZE=${AXONOPS_CASSANDRA_HEAP_SIZE:-4G}
      # Authentication
      - AXONOPS_DB_USER=axonops
      - AXONOPS_DB_PASSWORD=${AXONOPS_DB_PASSWORD:-axonops}
      # SSL/TLS (client-to-node encryption)
      # No CQL TLS: the image only enables client_encryption_options when a
      # keystore is mounted at CASSANDRA_KEYSTORE_PATH, and there is no variable
      # that turns it on by itself. axon-server must match (CQL_SSL below).
    volumes:
      - axondb-timeseries-data:/var/lib/cassandra
      - axondb-timeseries-logs:/var/log/cassandra
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # =============================================================================
  # axondb-search: OpenSearch 3.7.0 for logs and search functionality
  # =============================================================================
  axondb-search:
    # Preferred (immutable): ghcr.io/axonops/axondb-search@sha256:a7f2d508a54b3f0d890e70bf0bec1710345ea34696aa0a2bc66c66a0d075f565
    image: ghcr.io/axonops/axondb-search:3.7.0-1.6.1
    container_name: axondb-search
    hostname: axondb-search
    networks:
      - axonops-network
    environment:
      # Cluster configuration
      - OPENSEARCH_CLUSTER_NAME=axonopsdb-search
      # Both names are set on purpose. OPENSEARCH_DISCOVERY_TYPE is the image's
      # own variable and works from 3.7.0-1.6.1 onwards; discovery.type is
      # OpenSearch's native setting, read straight from the environment, and is
      # kept so this file also works against earlier images, where
      # OPENSEARCH_DISCOVERY_TYPE was printed in the startup banner but never
      # written to opensearch.yml — OpenSearch then ran its production bootstrap
      # checks and exited with "the default discovery settings are unsuitable
      # for production use". Drop the native line once no older image is in use.
      - discovery.type=single-node
      - OPENSEARCH_DISCOVERY_TYPE=single-node
      - OPENSEARCH_HEAP_SIZE=${AXONOPS_OPENSEARCH_HEAP_SIZE:-4g}
      # Authentication
      - AXONOPS_SEARCH_USER=admin
      - AXONOPS_SEARCH_PASSWORD=${AXONOPS_SEARCH_PASSWORD:-MyS3cur3P@ss2025}
      # SSL/TLS (enabled by default with auto-generated self-signed certs)
      - AXONOPS_SEARCH_TLS_ENABLED=${AXONOPS_OPENSEARCH_SSL:-true}
    volumes:
      - axondb-search-data:/var/lib/opensearch
      - axondb-search-logs:/var/log/opensearch
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      axondb-timeseries:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # axon-server: AxonOps backend API and agent endpoint
  # =============================================================================
  axon-server:
    # Preferred (immutable): registry.axonops.com/axonops-public/axonops-docker/axon-server@sha256:b7c41009929155942c34df77b262812fe1c39a32cdf7e132ef3437654a4bc4c1
    image: registry.axonops.com/axonops-public/axonops-docker/axon-server:2.0.39
    container_name: axon-server
    hostname: axon-server
    networks:
      - axonops-network
    environment:
      # axon-server is configured entirely through environment variables; each
      # overrides the corresponding field of the axon-server.yml in the image.
      - AXONSERVER_ORGNAME=${AXONOPS_ORG_NAME:-example}
      - LICENSE_KEY=${AXONOPS_LICENSE_KEY:-}
      - AXON_LOG_FILE=/dev/stdout
      - TLS_MODE=disabled
      # Reports v2: axon-server reaches axon-reporting through axon-dash's
      # network namespace (see the axon-reporting service below).
      - AXON_REPORTING_URL=http://axon-dash:8081
      # Metrics store (axondb-timeseries). CQL_SSL must match the note above.
      - CQL_HOSTS=axondb-timeseries
      - CQL_USERNAME=axonops
      - CQL_PASSWORD=${AXONOPS_DB_PASSWORD:-axonops}
      - CQL_LOCAL_DC=axonopsdb_dc1
      - CQL_PROTO_VERSION=4
      - CQL_AUTO_CREATE_TABLES=true
      - CQL_SSL=${AXONOPS_CASSANDRA_SSL:-false}
      - CQL_SSL_SKIP_VERIFY=true
      - "CQL_KS_REPLICATION={ 'class': 'NetworkTopologyStrategy', 'axonopsdb_dc1': 1 }"
      # Log and event store (axondb-search)
      - SEARCH_DB_HOSTS=https://axondb-search:9200
      - SEARCH_DB_USERNAME=admin
      - SEARCH_DB_PASSWORD=${AXONOPS_SEARCH_PASSWORD:-MyS3cur3P@ss2025}
      - SEARCH_DB_SKIP_VERIFY=true
    volumes:
      - axon-server-data:/var/lib/axonops
    ports:
      # Agent port - exposed for external Cassandra/Kafka agents to connect
      - "1888:1888"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      axondb-timeseries:
        condition: service_healthy
      axondb-search:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # axon-dash: AxonOps web dashboard
  # =============================================================================
  axon-dash:
    # Preferred (immutable): registry.axonops.com/axonops-public/axonops-docker/axon-dash@sha256:4cffd1d1e724a479c8ec489299972a43e0da0eef797e7aa27aa3acf6ae28423d
    image: registry.axonops.com/axonops-public/axonops-docker/axon-dash:2.0.39
    container_name: axon-dash
    hostname: axon-dash
    networks:
      - axonops-network
    environment:
      # axon-dash maps axon-dash.yml onto env vars by section and key:
      # axon-server.private_endpoints -> AXONSERVER_PRIVATE_ENDPOINTS. Left at
      # its file default of http://127.0.0.1:8080 the dash calls itself and
      # crash-loops with "findHost | no reachable endpoints".
      - AXONSERVER_PRIVATE_ENDPOINTS=http://axon-server:8080
      # axon-dash.reporting_url: axon-reporting shares this container's network
      # namespace, so the dash reaches it on localhost.
      - AXONDASH_REPORTING_URL=http://127.0.0.1:8081
    ports:
      # Dashboard web interface
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      axon-server:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # axon-reporting: Reports v2 rendering service, runs beside axon-dash
  # =============================================================================
  axon-reporting:
    # Preferred (immutable): registry.axonops.com/axonops-public/axonops-docker/axon-reporting@sha256:78dcd0bc74f900e3317db52cce3ba342d6d9d6c9224cf1ea35e1dc218195cf59
    image: registry.axonops.com/axonops-public/axonops-docker/axon-reporting:1.0.3
    container_name: axon-reporting
    # Share axon-dash's network namespace: each reaches the other on 127.0.0.1,
    # and axon-server reaches axon-reporting as axon-dash:8081. No networks,
    # ports or hostname here - they belong to axon-dash. Recreate this service
    # whenever axon-dash is recreated, or it stays in the old namespace.
    network_mode: "service:axon-dash"
    environment:
      # Render reports from the axon-dash beside it. Its built-in defaults
      # target a hosted dashboard, so both are set explicitly.
      - AXONDASH_URL_TEMPLATE=http://127.0.0.1:3000
      - AXONDASH_PATH_PREFIX=
    # No healthcheck: the image ships no curl or wget. From the axon-dash
    # container: curl -s http://127.0.0.1:8081/healthz
    depends_on:
      axon-dash:
        condition: service_started
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  axonops-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  axondb-timeseries-data:
    name: axonops-timeseries-data
  axondb-timeseries-logs:
    name: axonops-timeseries-logs
  axondb-search-data:
    name: axonops-search-data
  axondb-search-logs:
    name: axonops-search-logs
  axon-server-data:
    name: axonops-server-data
